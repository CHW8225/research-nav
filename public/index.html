<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>科研一站式导航 - 科研，从这里开始！</title>
    <meta name="description" content="专业的科研工具导航网站，一站式汇集文献检索、数据分析、论文写作、图形绘制、科研编程等全流程必备工具。">
    <meta name="keywords" content="科研导航,科研工具,学术工具,文献管理,数据分析,论文写作">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fa fa-graduation-cap"></i> 科研一站式导航
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#home"><i class="fa fa-home"></i> 首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about"><i class="fa fa-info-circle"></i> 关于</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="research-hero" id="home">
        <div class="hero-glow hero-glow-left"></div>
        <div class="hero-glow hero-glow-right"></div>
        <div class="container hero-content">
            <div class="hero-badge">
                <i class="fa fa-flask"></i>
                科研工具导航 · 本地图标缓存
            </div>
            <h1>让科研资源更好找，也更好用</h1>
            <p class="hero-subtitle">整理文献检索、AI 写作、数据分析、绘图制图、期刊投稿等常用科研入口。</p>
            <div class="search-box hero-search">
                <i class="fa fa-search search-icon"></i>
                <input type="text" id="searchInput" class="form-control" placeholder="搜索科研工具、网站或关键词">
                <button class="btn btn-primary" type="button" id="searchBtn">搜索</button>
            </div>
            <div class="search-suggestions" id="searchSuggestions"></div>
            <div class="site-stats">
                <div class="stat-pill"><strong id="totalLinksStat">158</strong><span>个工具链接</span></div>
                <div class="stat-pill"><strong id="totalCategoriesStat">23</strong><span>个科研分类</span></div>
                <div class="stat-pill"><strong>本地</strong><span>图标优先加载</span></div>
            </div>
        </div>
    </section>

    <section class="category-section">
        <div class="container">
            <div id="categoryList" class="category-list"></div>
        </div>
    </section>

    <main class="container links-main links-section">
        <div id="linksContainer" class="row"></div>
    </main>

    <!-- 页脚 -->
    <footer class="footer mt-5 py-4 bg-light">
        <div class="container text-center">
            <p class="mb-2">Copyright © 2025 科研一站式导航. All Rights Reserved.</p>
            <p class="text-muted small">为科研工作者提供一站式工具导航服务</p>
        </div>
    </footer>

    <!-- 公告弹窗 -->
    <div class="modal fade" id="announcementModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">
                        <i class="fa fa-bullhorn"></i> 公告通知
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="announcementContent">
                    <!-- 动态加载公告内容 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">我知道了</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 返回顶部按钮 -->
    <button class="btn btn-primary back-to-top" id="backToTop">
        <i class="fa fa-arrow-up"></i>
    </button>

    <!-- jQuery -->
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <!-- 自定义脚本 -->
    <script src="/assets/js/main.js"></script>
</body>
</html>
