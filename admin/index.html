<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 科研一站式导航</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/admin/assets/css/admin.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin/index.html">
                <i class="fa fa-cog"></i> 后台管理系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                           data-bs-toggle="dropdown">
                            <i class="fa fa-user-circle"></i>
                            <span id="currentUser">管理员</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" id="changePasswordBtn">
                                <i class="fa fa-key"></i> 修改密码</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="logoutBtn">
                                <i class="fa fa-sign-out"></i> 退出登录</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/" target="_blank">
                            <i class="fa fa-home"></i> 前台首页
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-2 d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" data-page="dashboard">
                                <i class="fa fa-tachometer"></i> 仪表盘
                            </a>
                        </li>
                        <li><h6 class="sidebar-heading">管理功能</h6></li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="categories">
                                <i class="fa fa-folder"></i> 分类管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="links">
                                <i class="fa fa-link"></i> 链接管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="announcements">
                                <i class="fa fa-bullhorn"></i> 公告管理
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区域 -->
            <main class="col-md-10 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2" id="pageTitle">仪表盘</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group me-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary" id="refreshBtn">
                                <i class="fa fa-refresh"></i> 刷新
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 内容区域 -->
                <div id="contentArea">
                    <!-- 仪表盘 -->
                    <div class="page-content" id="dashboardPage">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="stat-card">
                                    <div class="stat-icon bg-primary">
                                        <i class="fa fa-folder"></i>
                                    </div>
                                    <div class="stat-info">
                                        <h3 id="totalCategories">0</h3>
                                        <p>分类总数</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="stat-card">
                                    <div class="stat-icon bg-success">
                                        <i class="fa fa-link"></i>
                                    </div>
                                    <div class="stat-info">
                                        <h3 id="totalLinks">0</h3>
                                        <p>链接总数</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="stat-card">
                                    <div class="stat-icon bg-warning">
                                        <i class="fa fa-thumb-tack"></i>
                                    </div>
                                    <div class="stat-info">
                                        <h3 id="pinnedLinks">0</h3>
                                        <p>置顶链接</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="stat-card">
                                    <div class="stat-icon bg-info">
                                        <i class="fa fa-eye"></i>
                                    </div>
                                    <div class="stat-info">
                                        <h3 id="totalClicks">0</h3>
                                        <p>总点击数</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 分类管理 -->
                    <div class="page-content d-none" id="categoriesPage">
                        <div class="d-flex justify-content-between mb-3">
                            <button class="btn btn-primary" id="addCategoryBtn">
                                <i class="fa fa-plus"></i> 添加分类
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>图标</th>
                                        <th>名称</th>
                                        <th>排序</th>
                                        <th>链接数</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="categoriesTableBody">
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- 链接管理 -->
                    <div class="page-content d-none" id="linksPage">
                        <div class="d-flex justify-content-between mb-3">
                            <div>
                                <select class="form-select d-inline-block w-auto" id="categoryFilter">
                                    <option value="">所有分类</option>
                                </select>
                                <button class="btn btn-primary ms-2" id="addLinkBtn">
                                    <i class="fa fa-plus"></i> 添加链接
                                </button>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>图标</th>
                                        <th>标题</th>
                                        <th>分类</th>
                                        <th>点击数</th>
                                        <th>置顶</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="linksTableBody">
                                </tbody>
                            </table>
                        </div>
                        <nav id="linksPagination"></nav>
                    </div>

                    <!-- 公告管理 -->
                    <div class="page-content d-none" id="announcementsPage">
                        <div class="d-flex justify-content-between mb-3">
                            <button class="btn btn-primary" id="addAnnouncementBtn">
                                <i class="fa fa-plus"></i> 添加公告
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>标题</th>
                                        <th>内容</th>
                                        <th>状态</th>
                                        <th>创建时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="announcementsTableBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 通用模态框 -->
    <div class="modal fade" id="commonModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">标题</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- 动态内容 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="modalConfirmBtn">确认</button>
                </div>
            </div>
        </div>
    </div>

    <div id="adminToastContainer" class="admin-toast-container" aria-live="polite" aria-atomic="true"></div>

    <div class="modal fade" id="confirmModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content confirm-modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmModalTitle">确认操作</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body" id="confirmModalMessage">确定继续吗？</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" id="confirmModalCancel">取消</button>
                    <button type="button" class="btn btn-danger" id="confirmModalOk">确定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <!-- 自定义脚本 -->
    <script src="/admin/assets/js/admin.js"></script>
</body>
</html>
