<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 科研一站式导航</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .login-header i {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .login-header h2 {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0;
        }

        .login-body {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .input-group-text {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-right: none;
            border-radius: 8px 0 0 8px;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 8px 8px 0;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-login:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .login-footer {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            color: #666;
            font-size: 0.9rem;
        }

        .login-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        /* 加载动画 */
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fa fa-user-circle"></i>
                <h2>管理员登录</h2>
            </div>
            <div class="login-body">
                <!-- 错误提示 -->
                <div class="alert alert-danger d-none" id="errorAlert" role="alert">
                    <i class="fa fa-exclamation-circle"></i> <span id="errorMessage"></span>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fa fa-user"></i>
                            </span>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="请输入用户名" required autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">密码</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fa fa-lock"></i>
                            </span>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="请输入密码" required autocomplete="current-password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login" id="loginBtn">
                        <span class="btn-text">登录</span>
                        <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                </form>
            </div>
            <div class="login-footer">
                <a href="/"><i class="fa fa-home"></i> 返回首页</a>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <script>
        $(document).ready(function() {
            // 检查是否已登录
            const token = localStorage.getItem('adminToken');
            if (token) {
                // 验证 token 是否有效
                $.ajax({
                    url: '/api/auth/me',
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + token
                    },
                    success: function(response) {
                        if (response.role === 'admin') {
                            // 已登录，跳转到后台
                            window.location.href = '/admin/index.html';
                        } else {
                            localStorage.removeItem('adminToken');
                        }
                    },
                    error: function() {
                        localStorage.removeItem('adminToken');
                    }
                });
            }

            // 登录表单提交
            $('#loginForm').on('submit', function(e) {
                e.preventDefault();

                const username = $('#username').val().trim();
                const password = $('#password').val();

                if (!username || !password) {
                    showError('请输入用户名和密码');
                    return;
                }

                // 禁用按钮，显示加载状态
                setLoading(true);

                // 发送登录请求
                $.ajax({
                    url: '/api/auth/login',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        username: username,
                        password: password
                    }),
                    success: function(response) {
                        // 检查是否是管理员
                        if (response.user.role !== 'admin') {
                            showError('您没有管理员权限');
                            setLoading(false);
                            return;
                        }

                        // 保存 token
                        localStorage.setItem('adminToken', response.token);
                        localStorage.setItem('adminUser', JSON.stringify(response.user));

                        // 显示成功消息
                        $('#errorAlert').removeClass('alert-danger d-none').addClass('alert-success');
                        $('#errorMessage').text('登录成功，正在跳转...');

                        // 延迟跳转
                        setTimeout(function() {
                            window.location.href = '/admin/index.html';
                        }, 1000);
                    },
                    error: function(xhr) {
                        const errorMessage = xhr.responseJSON?.error || '登录失败，请检查用户名和密码';
                        showError(errorMessage);
                        setLoading(false);
                    }
                });
            });

            // 设置加载状态
            function setLoading(loading) {
                const $btn = $('#loginBtn');
                const $text = $btn.find('.btn-text');
                const $spinner = $btn.find('.spinner-border');

                if (loading) {
                    $btn.prop('disabled', true);
                    $text.text('登录中...');
                    $spinner.removeClass('d-none');
                } else {
                    $btn.prop('disabled', false);
                    $text.text('登录');
                    $spinner.addClass('d-none');
                }
            }

            // 显示错误消息
            function showError(message) {
                const $alert = $('#errorAlert');
                $alert.removeClass('alert-success d-none').addClass('alert-danger');
                $('#errorMessage').text(message);

                // 3秒后自动隐藏
                setTimeout(function() {
                    $alert.addClass('d-none');
                }, 3000);
            }
        });
    </script>
</body>
</html>
